{% extends "base.html" %}

{% block content %}
    <h2>Attended Concerts</h2>

    {% if concerts %}
        <ul>
            {% for concert in concerts %}
                <li>{{ concert.artist }} – {{ concert.city }} – {{ concert.date }}</li>
            {% endfor %}
        </ul>

    {% else %}
       <p>No past concerts logged.</p>
    {% endif %}

    <a href="{{ url_for('log_concert') }}" class = "btn">Log Concert</a>
{% endblock %}
