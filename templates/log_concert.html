{% extends "base.html" %}

{% block content %}
    <h2>Log a Past Concert</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        {{ form.artist.label }} {{ form.artist() }}
        {{ form.city.label }} {{ form.city() }}
        {{ form.date.label }} {{ form.date() }}
        <br>
        <br>
        {{ form.submit() }}
        <br>
        <br>
        <a href="{{ url_for('view_concerts') }}">Cancel</a>
    </form>
{% endblock %}
