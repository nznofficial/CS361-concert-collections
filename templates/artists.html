{% extends "base.html" %}

{% block content %}
    <a href="{{ url_for('add_artist') }}">Add Favorite Artist</a>
    
    <ul>
        {% for artist in artists %}
            <li>{{ artist.name }} – {{ artist.genre }} - <a href="{{ url_for('artist_detail', artist_id=loop.index0) }}" class="btn">More Info</a>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
